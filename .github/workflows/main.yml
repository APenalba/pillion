name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Make build script executable
        working-directory: iosApp
        run: chmod +x build-ipa.sh

      - name: Build IPA
        working-directory: iosApp
        run: ./build-ipa.sh Release

      - name: Verify IPA
        working-directory: iosApp
        run: |
          set -e

          if [ ! -f "Pillion.ipa" ]; then
            echo "ERROR: Pillion.ipa was not generated"
            exit 1
          fi

          echo "IPA generated successfully:"
          ls -lh Pillion.ipa

          echo
          echo "IPA contents:"
          unzip -l Pillion.ipa | head -100

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pillion-iOS
          path: iosApp/Pillion.ipa
          if-no-files-found: error
          retention-days: 7
